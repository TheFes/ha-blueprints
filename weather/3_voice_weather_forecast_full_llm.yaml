blueprint:
  name: Voice - Weather Forecasts - Full LLM script
  author: TheFes
  source_url: https://github.com/TheFes/ha-blueprints/blob/main/weather/3_voice_weather_forecast_full_llm.yaml
  description:
    "![Image](https://github.com/TheFes/ha-blueprints/blob/main/images/TheFesCasa_logo_bp_light.png?raw=true)

    # Request the weather forecast by use of an LLM

    ### Blueprint setup

    #### Required

    * Set a weather entity to use for the forecasts

    #### Optional

    * Adjust the prompts for each field used in the script. The descriptions guide the LLM to provide the correct input

    #### Note:
    
    * Give the script a clear description. This will be used by the LLM to understand it should use this script for weather forecasts.

    * **Make sure to expose the script to Assist after the script has been saved**

    #### Example for script description:

    `Fetches the weather forecast for either a part of a day, or one or more full days. In case the weather for the weekend is requested, this means Saturday and Sunday`

    ### Usage

    You can request the forecast in any way you can think of, using any language. Unless set otherwise in the LLM
    configuration, the response will be in the same language as the command.

    You can refer to a single day, multiple days (e.g. next weekend) a part of the day (e.g. next morning) or one or more hours
    (e.g. from 5 to 9).

    You can even ask for specific weather conditions, for example, will it rain tomorrow. Or should I take an umbrella if I 
    go out this evening.


    #### Examples

    ```

    Give me the weather forecast for this evening

    Do I need to apply sunscreen if I go out tomorrow morning

    Will it rain at 9 this evening

    What's the weather for this weekend

    ```"
  domain: script
  homeassistant:
    min_version: 2024.10.0
  input:
    weather_settings:
      name: Weather settings
      icon: mdi:weather-lightning-rainy
      description: Here you need to select the weather entity you want to use
      input:
        weather_entity:
          name: Weather entity
          description:
            Select the weather entity to use for the forecast. Needs to
            be a weather entity which provides an hourly and daily forecast
          selector:
            entity:
              multiple: false
              filter:
                - domain:
                    - weather
        calc_average:
          name: Calculate averages
          description:
            "When this is enabled, the LLM will only receive a summary
            of the data for the selected period, instead of the data for each hour/day.
            The summary contains the minimum and maximum temperature, the total precipitation,
            the highest precipitation probability, wind speed and UV index, and the averages
            of the other values. For the condition, the most frequent value and a list of all
            conditions in the period is sent.

            When disabled all data for each hour or day will be sent."
          selector:
            boolean: {}
          default: true
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      description:
        You can use these settings to finetune the prompts for your specific
        LLM (model). In most cases the defaults should be fine.
      collapsed: true
      input:
        time_period_type_prompt:
          name: Time period type prompt
          description:
            The prompt which will be used to the LLM can provide the type
            for the time period (days or hours)
          selector:
            text:
              multiline: true
              multiple: false
          default:
            "This argument is mandatory and must always be provided no matter
            what!

            Use 'daily' in case the request is for full days, examples: today, next
            Thursday, coming weekend. Use 'hourly' in case the request is for a
            part of a day, examples: at 8 hours this evening, next morning, this evening,
            from 3 to 5"
        time_period_length_prompt:
          name: Time period length prompt
          description:
            The prompt which will be used to the LLM can provide the length
            of the time period.
          selector:
            text:
              multiline: true
              multiple: false
          default:
            "This argument is mandatory and must always be provided no matter
            what!

            The length of the time period. This will be the number of days in case
            the 'time_period_type' is 'daily'  and the number of hours in case
            'time_period_type' is 'hourly'. Examples: 1 (day) if the request is
            for the forecast of today, 2 (days) if the request is for the weather
            this weekend, 6 (hours) if the request is for the weather periods like
            night, morning, afternoon and evening"
        date_prompt:
          name: Date prompt
          description:
            The prompt which will be used to the LLM can provide the start
            date for the forecast period
          selector:
            text:
              multiline: true
              multiple: false
          default:
            "This argument is mandatory and must always be provided no matter
            what!

            Provide the date on which the requested forecast starts. This date should
            be in the format YYYY-MM-DD. Always provide a date, so in case request
            is the forecast for today, provide today's date.

            When the forecast is for the night, do not use today's date but always
            use the next day, unless the current time is still before 05:00:00"
        time_prompt:
          name: Time prompt
          description:
            The prompt which will be used to the LLM can provide the start
            time for the forecast period
          selector:
            text:
              multiline: true
              multiple: false
          default:
            "This argument is mandatory and must always be provided no matter
            what!

            Provide the time on which the requested forecast starts. This time should
            be in the format HH:MM:SS in 24 hour format (for example 17:00:00). Always
            provide a time. In case a full day is requested, use 00:00:00, in case
            the current hour is requested, use the start of the hour.

            Night starts at 00:00:00, morning starts at 06:00:00, afternoon starts
            at 12:00:00  and evening starts at 18:00:00"
mode: parallel
max_exceeded: silent
description:
  "Gets the weather forecast for either a part of a day, or one or more
  full days. In case the weather for the weekend is requested, this means Saturday
  and Sunday

  "
fields:
  time_period_type:
    name: Time Period Type
    description: !input time_period_type_prompt
    selector:
      select:
        options:
          - daily
          - hourly
    required: true
  time_period_length:
    name: Time Period Length
    description: !input time_period_length_prompt
    selector:
      number:
        min: 1
        max: 48
    required: true
  start_date:
    name: Start Date
    description: !input date_prompt
    selector:
      date:
    required: true
  start_time:
    name: Start Time
    description: !input time_prompt
    selector:
      time:
    required: true
sequence:
  - alias: Set the input variables
    variables:
      version: 20261116
      weather_entity: !input weather_entity
      calc_average: !input calc_average
  - alias: Determine the supported forecast types
    variables:
      supported: >
        {% set sf = state_attr(weather_entity, 'supported_features') | int(0) %}
        {% set d = ['daily'] if sf | bitwise_and(1) else [] %}
        {% set h = ['hourly'] if sf | bitwise_and(2) else [] %}
        {% set td = ['twice_daily'] if sf | bitwise_and(4) else [] %}
        {{ d + h + td }}
      requested_type: "{{ time_period_type | default('daily') if time_period_type | default in ['daily', 'hourly'] else 'daily' }}"
  - alias: Check the forecast type
    variables:
      time_period_type: >
        {% if requested_type == 'hourly' and 'hourly' not in supported %}
          {{ 'daily' if 'daily' in supported else 'twice_daily' }}
        {% elif requested_type == 'daily' and 'daily' not in supported and 'twice_daily' in supported %}
          twice_daily
        {% else %}
          {{ requested_type }}
        {% endif %}
  - alias: Validate the date and time provided by the LLM
    variables:
      start_date: >
        {% set d = start_date | default('', true) | string | trim %}
        {{ d[:10] if d is match('\d{4}-\d{2}-\d{2}') else '' }}
      start_time: >
        {% set t = start_time | default('00:00:00', true) | string | trim %}
        {% set t = t ~ ':00' if t is match('^\d{1,2}:\d{2}$') else t %}
        {{ t if as_timedelta(t) is not none else '00:00:00' }}
      length: "{{ [time_period_length | default(1) | int(1), 1] | max }}"
  - alias: Determine the start of the period
    variables:
      start: >
        {% if start_date %}
          {% set s = as_datetime(start_date) | as_local %}
          {{ (s + as_timedelta(start_time) if requested_type == 'hourly' and time_period_type == 'hourly' else s).isoformat() }}
        {% else %}
          NA
        {% endif %}
  - alias: Determine the end of the period
    variables:
      end: >
        {% if start != 'NA' %}
          {% set s = as_datetime(start) %}
          {% if requested_type == 'hourly' and time_period_type == 'hourly' %}
            {{ (s + timedelta(hours=length)).isoformat() }}
          {% elif requested_type == 'hourly' %}
            {# no hourly forecast available, use the full days which contain the requested hours #}
            {% set e = s + as_timedelta(start_time) + timedelta(hours=length) %}
            {% set m = as_datetime(e.date() | string) | as_local %}
            {{ (m if e == m else m + timedelta(days=1)).isoformat() }}
          {% else %}
            {{ (s + timedelta(days=length)).isoformat() }}
          {% endif %}
        {% endif %}
  - alias: Check if variables were set correctly
    if:
      - condition: template
        value_template: "{{ start == 'NA' or end | as_datetime < now() }}"
    then:
      - alias: Set variable for error message
        variables:
          response:
            error: >-
              Unable to provide forecast because the start date was not provided in the
              format YYYY-MM-DD, or the requested period is in the past
      - alias: Stop the script
        stop: Unable to determine the date for the weather forecast, or the date is in the past
        response_variable: response
  - if: "{{ time_period_type not in supported }}"
    then:
      - alias: Set variable for error message
        variables:
          response:
            error: >-
              Unable to provide forecast because the weather provider doesn't provide
              forecast data for {{ requested_type }} periods
      - alias: Stop the script
        stop: Weather provider doesn't provide {{ time_period_type }} forecast data
        response_variable: response
  - action: weather.get_forecasts
    data:
      type: "{{ time_period_type }}"
    target:
      entity_id: !input weather_entity
    response_variable: weather_response
    continue_on_error: true
  - alias: Select the forecast data for the requested period
    variables:
      all_forecast: >
        {{ weather_response[weather_entity].forecast | default([])
           if weather_response is defined and weather_entity in weather_response else [] }}
      selected: >
        {% set ns = namespace(forecast=[]) %}
        {% for item in all_forecast %}
          {% set dt = item.datetime | as_datetime | as_local %}
          {% if start | as_datetime <= dt < end | as_datetime %}
            {% set ns.forecast = ns.forecast + [dict(item, datetime=dt.isoformat())] %}
          {% endif %}
        {% endfor %}
        {{ ns.forecast }}
  - alias: Stop when there is no forecast data for the requested period
    if:
      - condition: template
        value_template: "{{ selected | count == 0 }}"
    then:
      - variables:
          response:
            error: >-
              {%- if all_forecast | count == 0 -%}
                The weather provider returned no forecast data
              {%- else -%}
                No forecast data available for the requested period. The {{ time_period_type }} forecast is available from
                {{ (all_forecast | first).datetime | as_datetime | as_local }} until {{ (all_forecast | last).datetime | as_datetime | as_local }}
              {%- endif -%}
      - stop: No forecast data for the requested period
        response_variable: response
  - alias: Collect the units
    variables:
      units:
        temperature: "{{ state_attr(weather_entity, 'temperature_unit') }}"
        precipitation: "{{ state_attr(weather_entity, 'precipitation_unit') }}"
        wind_speed: "{{ state_attr(weather_entity, 'wind_speed_unit') }}"
        pressure: "{{ state_attr(weather_entity, 'pressure_unit') }}"
        visibility: "{{ state_attr(weather_entity, 'visibility_unit') }}"
        wind_bearing: degrees
  - alias: Collect current conditions
    variables:
      current_conditions: >
        {% if start | as_datetime <= now() < end | as_datetime %}
          {% set a = states[weather_entity].attributes %}
          {% set keys = ['temperature', 'apparent_temperature', 'humidity', 'cloud_coverage', 'uv_index',
                         'wind_speed', 'wind_gust_speed', 'wind_bearing', 'precipitation', 'visibility'] %}
          {% set ns = namespace(d={'condition': states(weather_entity)}) %}
          {% for k in keys if a.get(k) is not none %}
            {% set ns.d = dict(ns.d, **{k: a.get(k)}) %}
          {% endfor %}
          {{ ns.d }}
        {% else %}
          {{ none }}
        {% endif %}
  - alias: Summarize the forecast data
    variables:
      summary: >
        {% set items = selected %}
        {% set keys = items | map('list') | sum(start=[]) | unique | reject('in', ['datetime', 'is_daytime']) | list %}
        {% set ns = namespace(d={}) %}
        {% for k in keys %}
          {% set v = items | selectattr(k, 'defined') | map(attribute=k) | reject('none') | list %}
          {% if v %}
            {% if v[0] is string %}
              {% set ns.d = dict(ns.d, **{k ~ '_most_frequent': v | statistical_mode}) %}
              {% if k == 'condition' %}
                {% set ns.d = dict(ns.d, conditions_in_period=v | unique | list) %}
              {% endif %}
            {% elif k == 'wind_bearing' %}
              {% set n = v | select('is_number') | list %}
              {% if n %}
                {% set t = namespace(s=0, c=0) %}
                {% for b in n %}
                  {% set t.s = t.s + sin(b * pi / 180) %}
                  {% set t.c = t.c + cos(b * pi / 180) %}
                {% endfor %}
                {% set ns.d = dict(ns.d, wind_bearing_average=((atan2(t.s, t.c) * 180 / pi) % 360) | round(0)) %}
              {% endif %}
            {% elif k in ['temperature', 'apparent_temperature', 'dew_point'] %}
              {% set ns.d = dict(ns.d, **{k: {'min': v | min | round(1), 'max': v | max | round(1)} if v | count > 1 else v[0] | round(1)}) %}
            {% elif k == 'templow' %}
              {% set ns.d = dict(ns.d, templow_min=v | min | round(1)) %}
            {% elif k == 'precipitation' %}
              {% set ns.d = dict(ns.d, precipitation_total=v | sum | round(1)) %}
            {% elif k in ['precipitation_probability', 'wind_speed', 'wind_gust_speed', 'uv_index'] %}
              {% set ns.d = dict(ns.d, **{k ~ '_max': v | max | round(1)}) %}
            {% else %}
              {% set ns.d = dict(ns.d, **{k ~ '_average': v | average | round(0)}) %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.d }}
  - alias: Create the response
    variables:
      response: >
        {% set r = {
          'start_of_period': start,
          'end_of_period': end,
          'forecast_type': time_period_type,
          'units': units
        } %}
        {% set r = dict(r, note='The weather provider has no hourly forecast, so the forecast for the full day is provided') if requested_type == 'hourly' and time_period_type != 'hourly' else r %}
        {% set r = dict(r, current_conditions=current_conditions) if current_conditions else r %}
        {{ dict(r, summary_for_period=summary) if calc_average else dict(r, forecast=selected) }}
  - stop: ""
    response_variable: response
