blueprint:
  name: Voice - Get ToDo entries - Full LLM script
  author: TheFes
  source_url: https://github.com/TheFes/ha-blueprints/blob/main/todo/3_voice_get_todo_entries_full_llm.yaml
  description:
    "![Image](https://github.com/TheFes/ha-blueprints/blob/main/images/TheFesCasa_logo_bp_light.png?raw=true)

    # Request the todo entries by use of an LLM

    ### Blueprint setup

    #### Optional

    * Adjust the prompts for each field used in the script. The descriptions guide
    the LLM to provide the correct input

    #### Note:

    * Give the script a clear description. This will be used by the LLM to understand
    it should use this script for the todo list items.

    * **Make sure to expose the script to Assist after the script has been saved**

    #### Example for script description:

    `Fetch todo items from my todo lists. Note that the shopping list is also considered
    a todo list. Ignore items marked as completed, unless the user specifically requests them.`

    ### Usage

    You can request the todo items in any way you can think of, using any
    language. Unless set otherwise in the LLM configuration, the response will be
    in the same language as the command.

    #### Examples

    ```

    What's on the shopping list?

    Are there carrots on the shopping list?

    Which todo items are planned for today? (only in case the todo items have due dates)

    ```"
  domain: script
  homeassistant:
    min_version: 2024.10.0
  input:
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      description:
        You can use these settings to finetune the prompts for your specific
        LLM (model). In most cases the defaults should be fine.
      collapsed: true
      input:
        todo_entities_prompt:
          name: Todo Entity Prompt
          description:
            The prompt which will be used to the LLM can select the right todo
            entities
          selector:
            text:
              multiline: true
              multiple: false
          default:
            "This argument is mandatory and must always be provided no matter
            what!

            Based on the request by the user, select one or more todo entities from which
            the items on the list should be fetched. Use the entity_id of the todo list
            (preferred) or its name.

            Completed items are only returned when the include_completed field is set to true."
mode: parallel
max_exceeded: silent
fields:
  todo_entities:
    selector:
      entity:
        filter:
          domain: todo
        multiple: true
    name: ToDo entities
    required: true
    description: !input todo_entities_prompt
  include_completed:
    name: Include completed items
    description: >-
      Set to true only when the user explicitly asks for items which are completed (done).
      By default only the items which still need to be done are returned.
    selector:
      boolean: {}
sequence:
  - alias: Match the requested lists with the todo entities
    variables:
      version: 20261116
      requested: >
        {% set t = todo_entities | default([], true) %}
        {{ ([t] if t is string else t | list) | map('string') | map('lower') | map('trim') | list }}
      available: >
        {% set ns = namespace(l=[]) %}
        {% for s in states.todo | rejectattr('state', 'eq', 'unavailable') %}
          {% set ns.l = ns.l + [{'entity_id': s.entity_id, 'name': s.name}] %}
        {% endfor %}
        {{ ns.l }}
      todo: >
        {% set ns = namespace(found=[]) %}
        {% for r in requested %}
          {% set ns2 = namespace(e=none, p=none) %}
          {% for s in available %}
            {% set n = s.name | lower %}
            {% if ns2.e is none and (s.entity_id == r or n == r) %}
              {% set ns2.e = s.entity_id %}
            {% elif ns2.p is none and (r in n or n in r or r in s.entity_id) %}
              {% set ns2.p = s.entity_id %}
            {% endif %}
          {% endfor %}
          {% set m = ns2.e or ns2.p %}
          {% set ns.found = ns.found + ([m] if m else []) %}
        {% endfor %}
        {{ ns.found | unique | list }}
  - alias: Stop when no list was found
    if:
      - condition: template
        value_template: "{{ todo | count == 0 }}"
    then:
      - variables:
          response:
            error: >-
              No todo list found for {{ requested | join(', ') }}. Available lists (entity_id = name):
              {% for s in available %}{{ s.entity_id }} = {{ s.name }}{{ '; ' if not loop.last }}{% endfor %}
      - stop: No todo list found
        response_variable: response
  - action: todo.get_items
    continue_on_error: true
    target:
      entity_id: "{{ todo }}"
    data:
      status: "{{ ['needs_action', 'completed'] if include_completed | default(false) | bool(false) else ['needs_action'] }}"
    response_variable: response
  - if:
      - condition: template
        value_template: "{{ response is not defined }}"
    then:
      - variables:
          response:
            error: Unable to retrieve the items of the todo list
  - stop: ""
    response_variable: response
